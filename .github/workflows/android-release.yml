name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          [ -f "./gradlew" ] || { echo "::error::gradlew not found. Run 'gradle wrapper' locally and commit gradlew + gradle-wrapper.jar."; exit 1; }
          [ -f "./gradle/wrapper/gradle-wrapper.properties" ] || { echo "::error::gradle-wrapper.properties not found."; exit 1; }
          [ -f "./settings.gradle.kts" ] || { echo "::error::settings.gradle.kts not found."; exit 1; }
          [ -f "./build.gradle.kts" ] || { echo "::error::root build.gradle.kts not found."; exit 1; }
          echo "Project structure looks valid."

      - name: Make Gradle Wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Run tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --warning-mode all

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Release APK was generated."
            exit 1
          fi
          find . -type f -path "*/build/outputs/apk/release/*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: multitouch-tester-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
